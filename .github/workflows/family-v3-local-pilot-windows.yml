name: family-v3-local-pilot-windows-preflight

on:
  pull_request:
    paths:
      - "apps/web/scripts/family-v3-local-pilot.ps1"
      - ".github/workflows/family-v3-local-pilot-windows.yml"

permissions:
  contents: read

jobs:
  no-deploy-powershell-preflight:
    name: Windows PowerShell 5.1 local-only pilot guard (NO DEPLOY)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # The tested source SHA must exist for the fail-closed ancestor check.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify guarded V3 local launcher without building or opening a port
        shell: powershell
        run: |
          & .\apps\web\scripts\family-v3-local-pilot.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "LOCAL_PILOT_PREFLIGHT_FAILED" }
      - name: State exact evidence boundaries
        shell: powershell
        run: |
          Write-Host "WINDOWS_POWERSHELL_5_1_PREFLIGHT=PASS"
          Write-Host "INSTALL_OR_BUILD_PERFORMED=NO"
          Write-Host "LOCAL_SERVER_STARTED=NO"
          Write-Host "LIVE_CLOUDFLARE_DEPLOYED=NO"
          Write-Host "HUMAN_FAMILY_TEST=NOT_PERFORMED"

  localhost-boot-smoke:
    name: Windows PowerShell 5.1 build and localhost Family smoke (NO DEPLOY)
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_PUBLIC_CRESCO_API_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact guarded branch, no build yet
        shell: powershell
        run: |
          & .\apps\web\scripts\family-v3-local-pilot.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_PILOT_SOURCE_NOT_VERIFIED" }
      - name: Install and build sealed local Family artifact
        shell: powershell
        working-directory: apps/web
        run: |
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_NPM_CI_FAILED" }
          & npm.cmd run build:public-family
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_FAMILY_ISOLATED_BUILD_FAILED" }
      - name: Start local Wrangler Worker and verify real HTTP routes
        shell: powershell
        working-directory: apps/web
        run: |
          $ErrorActionPreference = "Stop"
          $worker = $null
          $out = Join-Path $env:RUNNER_TEMP "family-localhost.stdout.log"
          $err = Join-Path $env:RUNNER_TEMP "family-localhost.stderr.log"
          try {
            $worker = Start-Process -FilePath "cmd.exe" -ArgumentList @(
              "/d", "/c", "npm.cmd run start:vinext -- --ip 127.0.0.1 --port 3100"
            ) -WorkingDirectory (Get-Location).Path -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($worker.HasExited) { throw "LOCAL_WRANGLER_EXITED_BEFORE_READY" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:3100/try" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200 -and $response.Content -match "(?i)cresco") { $ready = $true; break }
              } catch {
                # Startup probe: only localhost is accessed, never a public Worker.
              }
            }
            if (-not $ready) { throw "LOCAL_FAMILY_HOME_NOT_READY" }
            foreach ($path in @("/try/learn", "/try/portfolio", "/try/profile")) {
              $response = Invoke-WebRequest -Uri ("http://127.0.0.1:3100" + $path) -UseBasicParsing -TimeoutSec 15
              if ($response.StatusCode -ne 200) { throw "LOCAL_ROUTE_NOT_READY: $path" }
              Write-Host "LOCAL_FAMILY_ROUTE_PASS=$path"
            }
            Write-Host "WINDOWS_LOCALHOST_FAMILY_HTTP_SMOKE=PASS"
            Write-Host "LOCAL_URL=http://127.0.0.1:3100/try"
            Write-Host "PUBLIC_WORKER_DEPLOYED=NO"
          } finally {
            if ($worker) {
              & taskkill.exe /PID $worker.Id /T /F *> $null
            }
            if (Test-Path $out) { Get-Content $out -Tail 40 }
            if (Test-Path $err) { Get-Content $err -Tail 40 }
          }
      - name: State exact verification boundaries
        shell: powershell
        run: |
          Write-Host "BUILD_AND_LOCAL_HTTP_TEST=PASS"
          Write-Host "WINDOWS_REAL_USER_PC=NOT_TESTED"
          Write-Host "REAL_MOBILE_DEVICE=NOT_TESTED"
          Write-Host "CLOUDFLARE_DEPLOYED=NO"
