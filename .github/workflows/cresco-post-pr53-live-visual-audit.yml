name: CRESCO post-PR53 hosted visual audit

on:
  push:
    branches: [audit/cresco-live-after-pr53-20261012]
  pull_request:
    branches: [main]
    paths: [.github/workflows/cresco-post-pr53-live-visual-audit.yml]

permissions:
  contents: read

jobs:
  public-readonly-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install audit browser (no deploy)
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Render public CRESCO and check PR53 layout fixes
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import { mkdirSync, writeFileSync, appendFileSync } from "node:fs";
          const browser=await chromium.launch({headless:true});
          const base="https://cresco.faadil-casecraft.workers.dev";
          const views=[
            ["home-desktop","/",1440,900],
            ["home-mobile","/",390,844],
            ["home-tablet","/",768,1024],
            ["desk-desktop","/worlds-fair/desk",1440,900],
            ["desk-mobile","/worlds-fair/desk",390,844],
            ["how-desktop","/how-it-works",1440,900]
          ];
          mkdirSync("ui-audit-output",{recursive:true});
          let failures=0;const observations=[];
          try {
            for (const [label,path,width,height] of views) {
              const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,colorScheme:"light"});
              const page=await ctx.newPage();
              const errors=[];
              page.on("pageerror",e=>errors.push(e.message.slice(0,200)));
              let status="error";
              try {
                const r=await page.goto(base+path,{waitUntil:"domcontentloaded",timeout:30000});
                status=r?.status()??"null";
                await page.evaluate(()=>document.fonts.ready);
                await page.waitForTimeout(800);
                const properties=await page.evaluate(()=>({
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
                  title:document.title,
                  firstH1:document.querySelector("h1")?.innerText,
                  newHero:document.body.innerText.includes("Grow independence"),
                  navMenu:!![...document.querySelectorAll("summary")].find(x=>x.textContent?.includes("Explore CRESCO"))
                }));
                if(path==="/"&&width===1440){
                  const stage=page.locator(".cresco-story-stage").first();
                  const cards=stage.locator(":scope > .cresco-demo-card");
                  properties.overlayPositions=await cards.evaluateAll(nodes=>nodes.map(n=>getComputedStyle(n).position));
                  properties.cardRects=await cards.evaluateAll(nodes=>nodes.map(n=>{const {x,y,width,height}=n.getBoundingClientRect();return {x,y,width,height}}));
                  if(properties.overlayPositions?.some(p=>p!=="absolute"))failures++;
                }
                if(path==="/"&&width===390){
                  if(!properties.navMenu)failures++;
                  else{
                    const summary=page.locator("summary").filter({hasText:"Explore CRESCO"});
                    await summary.click();
                    properties.navExpanded=await page.getByRole("navigation",{name:"CRESCO mobile navigation"}).isVisible();
                    properties.capitalVisible=await page.getByRole("navigation",{name:"CRESCO mobile navigation"}).getByText("Delegated capital").isVisible();
                    if(!properties.navExpanded||!properties.capitalVisible)failures++;
                  }
                }
                if(properties.overflow)failures++;
                if(status!==200)failures++;
                const image=await page.screenshot({type:"jpeg",quality:45,fullPage:false,animations:"disabled"});
                writeFileSync(`ui-audit-output/${label}.jpg`,image);
                if(["home-desktop","home-mobile","desk-desktop"].includes(label)){
                  const b64=image.toString("base64");
                  console.log(`CRESCO_AUDIT_BEGIN:${label}:${b64.length}`);
                  for(let k=0;k<b64.length;k+=1800)console.log(`CRESCO_AUDIT_CHUNK:${label}:${b64.slice(k,k+1800)}`);
                  console.log(`CRESCO_AUDIT_END:${label}`);
                }
                observations.push({label,path,status,...properties,errors});
              }catch(e){failures++;observations.push({label,status,error:String(e).slice(0,350)})}
              await ctx.close();
            }
          }finally{await browser.close()}
          const result={sourceSha:"085c26bfb12f6cf7bee0417bd8a145811df40b85",host:base,checks:observations,failures,claim:"Public page rendering only; host's deployed commit cannot be cryptographically bound from visual markers"};
          writeFileSync("ui-audit-output/report.json",JSON.stringify(result,null,2));
          const info=observations.map(x=>`| ${x.label} | ${x.status} | ${x.overflow===false?"NO":x.overflow===true?"YES":"UNKNOWN"} | ${x.newHero?"YES":"no"} | ${x.navExpanded?"YES":"-"} |`).join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Read-only visual audit\n| Screen | HTTP | overflow | new hero | mobile menu |\n|---|---|---|---|---|\n"+info+"\n\nNo transactions, role tokens or API writes. Source commit does NOT prove runtime binding.\n");
          console.log("CRESCO_AUDIT_REPORT:"+JSON.stringify(result));
          if(failures)process.exitCode=1;
          NODE
      - name: Observe historical consumer CRESCO art for visual comparison
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          import { writeFileSync,appendFileSync } from "node:fs";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          try{
            const url="https://cresco-lac.vercel.app/home";
            const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:25000});
            await page.evaluate(()=>document.fonts.ready);
            await page.waitForTimeout(600);
            const sources=await page.evaluate(()=>({
              title:document.title,
              head:document.querySelector("h1")?.innerText,
              images:[...document.querySelectorAll("img")].slice(0,20).map(x=>({alt:x.alt,src:x.currentSrc.slice(0,280)})),
              inlineSvgCount:document.querySelectorAll("svg").length,
              externalStylesheets:[...document.querySelectorAll("link[rel='stylesheet']")].map(x=>x.href.slice(0,140)).slice(0,10)
            }));
            const jpeg=await page.screenshot({type:"jpeg",quality:48,fullPage:false,animations:"disabled"});
            writeFileSync("ui-audit-output/historical-vercel-home.jpg",jpeg);
            const b64=jpeg.toString("base64");
            console.log("CRESCO_HISTORIC_BEGIN:"+b64.length);
            for(let k=0;k<b64.length;k+=1800)console.log("CRESCO_HISTORIC_CHUNK:"+b64.slice(k,k+1800));
            console.log("CRESCO_HISTORIC_END");
            console.log("CRESCO_HISTORIC_META:"+JSON.stringify({status:response?.status(),url:page.url(),...sources}));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\nOld Vercel /home comparison response: "+response?.status()+"; screenshots in artifact.\n");
          }catch(e){console.log("CRESCO_HISTORIC_UNAVAILABLE:"+String(e).slice(0,250))}
          await browser.close();
          NODE
      - name: Publish audit screenshots and structured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cresco-post-pr53-public-screenshots
          path: apps/web/ui-audit-output/
          if-no-files-found: warn
