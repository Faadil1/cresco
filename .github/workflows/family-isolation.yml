name: family-isolation-build
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "src/cloudflare-family-only-worker.mjs"
      - "src/worlds-fair-workflow.mjs"
      - "src/worlds-fair-workflow-http.mjs"
      - "wrangler.family-api.jsonc"
      - "scripts/family-release-boundary.mjs"
      - "scripts/family-standalone-readonly-probe.mjs"
      - "test/family-release-boundary.test.mjs"
      - "test/family-standalone-readonly-probe.test.mjs"
      - "test/cloudflare-family-isolation.test.mjs"
      - ".github/workflows/family-isolation.yml"
jobs:
  family-build:
    name: Family-only Cloudflare artifact (NO DEPLOY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build:public-family
      - name: Verify historic Worker freeze and exact Family Web artifact
        run: |
          node ../../scripts/family-release-boundary.mjs --built-web
          echo 'Public Family static-learning artifact only. No API, Wrangler deploy or Cloudflare write.'

  family-api-dry-run:
    name: Family-only API bundle (WRANGLER DRY RUN; NO DEPLOY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release boundary and read-only probe regressions
        run: |
          node scripts/family-release-boundary.mjs
          node --test test/family-release-boundary.test.mjs test/family-standalone-readonly-probe.test.mjs
      - run: npm install --no-audit --no-fund
      - name: Verify isolated API target before bundling
        run: |
          node -e 'const fs=require("node:fs");const f=JSON.parse(fs.readFileSync("./wrangler.family-api.jsonc","utf8")); if(f.name!=="cresco-family-api" || f.main!=="src/cloudflare-family-only-worker.mjs" || f.durable_objects.bindings[0].class_name!=="CrescoFamilyIsolatedState") process.exit(1)'
      - name: Bundle family API without authentication, upload or deployment
        run: npx --yes wrangler@4.118.0 deploy --dry-run --config wrangler.family-api.jsonc --outdir .family-api-dry-run
