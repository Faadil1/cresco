name: family-real-world-windows-review

on:
  pull_request:
    paths:
      - ".github/workflows/family-real-world-windows-review.yml"
      - "apps/web/scripts/family-sec-snapshot.mjs"
      - "apps/web/src/lib/family-sec-snapshot.json"
      - "apps/web/src/components/family-real-world-panel.tsx"
      - "apps/web/src/components/family-real-company-research.tsx"
      - "apps/web/src/app/try/(story)/portfolio/companies/page.tsx"
      - "apps/web/e2e/family-real-world.spec.mjs"

permissions:
  contents: read

jobs:
  windows-review:
    name: Windows local SEC + isolated Family build + HTTP (NO DEPLOY)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_PUBLIC_CRESCO_API_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate offline SEC normalizer (no network)
        shell: powershell
        working-directory: apps/web
        run: |
          & node --check scripts/family-sec-snapshot.mjs
          if ($LASTEXITCODE -ne 0) { throw "SEC_SCRIPT_SYNTAX_INVALID" }
          & node scripts/family-sec-snapshot.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "SEC_NORMALIZER_SELF_TEST_FAILED" }
      - name: Install and build isolated Family artifact
        shell: powershell
        working-directory: apps/web
        run: |
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_NPM_CI_FAILED" }
          & npm.cmd run build:public-family
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_FAMILY_BUILD_FAILED" }
      - name: Start localhost and verify research route
        shell: powershell
        working-directory: apps/web
        run: |
          $ErrorActionPreference = "Stop"
          $worker = $null
          $out = Join-Path $env:RUNNER_TEMP "realworld.stdout.log"
          $err = Join-Path $env:RUNNER_TEMP "realworld.stderr.log"
          try {
            $worker = Start-Process -FilePath "cmd.exe" -ArgumentList @(
              "/d", "/c", "npm.cmd run start:vinext -- --ip 127.0.0.1 --port 3100"
            ) -WorkingDirectory (Get-Location).Path -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
            $ready = $false
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 1
              if ($worker.HasExited) { throw "WRANGLER_EARLY_EXIT" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:3100/try" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "LOCALHOST_NOT_READY" }
            foreach ($path in @("/try/learn", "/try/portfolio", "/try/portfolio/companies", "/try/profile")) {
              $response = Invoke-WebRequest -Uri ("http://127.0.0.1:3100" + $path) -UseBasicParsing -TimeoutSec 15
              if ($response.StatusCode -ne 200) { throw "ROUTE_NOT_OK: $path" }
              Write-Host "LOCAL_FAMILY_ROUTE_PASS=$path"
            }
            Write-Host "WINDOWS_LOCALHOST_REAL_WORLD_HTTP_SMOKE=PASS"
            Write-Host "PUBLIC_WORKER_DEPLOYED=NO"
            Write-Host "SEC_LIVE_FETCH=NOT_PERFORMED"
            Write-Host "TRADINGVIEW_THIRD_PARTY_LOAD=NOT_TESTED"
          } finally {
            if ($worker) { & taskkill.exe /PID $worker.Id /T /F *> $null }
            if (Test-Path $out) { Get-Content $out -Tail 30 }
            if (Test-Path $err) { Get-Content $err -Tail 30 }
          }
